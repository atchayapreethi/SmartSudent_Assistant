<!DOCTYPE html>
<html>
<head>
    <title>AI Student Support Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 70%;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .answer {
            margin-top: 25px;
            padding: 20px;
            background: #f1f1f1;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Student Support Assistant</h1>

    <form method="POST">

        <textarea
            name="question"
            placeholder="Ask your question..."
            required>{{ question }}</textarea>

        <br>

        <button type="submit">
            Ask Assistant
        </button>

    </form>

    {% if answer %}

    <div class="answer">

        <h3>Assistant:</h3>

        {{ answer }}

    </div>

    {% endif %}

</div>

</body>
</html>
